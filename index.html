<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NikitaCrafts</title><link rel="stylesheet" href="style.css">
</head><body>
<canvas id="game"></canvas>
<div id="menu"><div class="card">

<p>Fast-boot voxel sandbox</p>
<input id="seed" value="Nikita123" placeholder="World seed">
<button id="new">NEW WORLD</button><button id="cont">CONTINUE</button>

</div></div>
<div id="hud" hidden>
<div class="top"><b>NIKITA<span>CRAFTS</span></b><button id="menuBtn">☰</button></div>
<div id="cross">+</div><div id="joy"><i></i></div><div id="look"></div>
<div class="actions"><button id="mine">⛏</button><button id="place">＋</button><button id="jump">↑</button></div>
<div id="hotbar"></div><div id="msg"></div>
</div>
<script src="game.js"></script>
</body></html>
